<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101922">
<title>MiniChat 3.0 ❤️</title>
<style>
:root {
  --bg:#101922;
  --panel:#182533;
  --panel2:#223344;
  --accent:#62c6b2;
  --text:#f4f7fa;
  --muted:#9babb9;
  --border:#2b3c4d;
  --danger:#ff7785;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,textarea { font:inherit; }
button { cursor:pointer; }
button:disabled { opacity:.55; cursor:default; }
.hidden { display:none !important; }
button:focus-visible,input:focus-visible,textarea:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:2px;
}
#app {
  width:100%;
  max-width:760px;
  min-height:100dvh;
  margin:auto;
  background:var(--bg);
  position:relative;
}
.topbar {
  position:sticky;
  top:0;
  z-index:10;
  min-height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px 15px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
}
.brand {
  display:flex;
  align-items:center;
  gap:10px;
  font-size:21px;
  font-weight:800;
}
.brand-icon {
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:15px;
  color:#10211f;
  background:var(--accent);
}
.icon-btn {
  min-width:42px;
  min-height:42px;
  padding:7px;
  border:0;
  border-radius:13px;
  background:var(--panel2);
  color:var(--text);
}
.card {
  margin:14px;
  padding:18px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
}
.field {
  display:block;
  width:100%;
  min-height:48px;
  margin:9px 0;
  padding:12px 14px;
  color:var(--text);
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:14px;
  outline:none;
}
.field:focus { border-color:var(--accent); }
.primary-btn {
  width:100%;
  min-height:49px;
  margin-top:8px;
  border:0;
  border-radius:14px;
  background:var(--accent);
  color:#10211f;
  font-weight:800;
}
.muted { color:var(--muted); }
.section-title {
  padding:20px 16px 8px;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  letter-spacing:1px;
  text-transform:uppercase;
}
.chat-item {
  display:flex;
  align-items:center;
  width:calc(100% - 24px);
  gap:12px;
  margin:8px 12px;
  padding:12px;
  text-align:left;
  color:var(--text);
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:17px;
}
.avatar {
  display:grid;
  place-items:center;
  flex-shrink:0;
  width:49px;
  height:49px;
  overflow:hidden;
  border-radius:50%;
  background:var(--panel2);
  font-size:23px;
}
.avatar img {
  width:100%;
  height:100%;
  object-fit:cover;
}
.chat-info { flex:1; min-width:0; }
.chat-name {
  font-weight:750;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.chat-preview {
  margin-top:5px;
  font-size:13px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
#chatHeader {
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
}
#headerInfo { flex:1; min-width:0; }
#headerTitle { font-weight:750; }
#headerStatus { margin-top:3px; font-size:12px; color:var(--muted); }
#messages {
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:14px 12px;
  min-height:35vh;
  overflow-y:auto;
  overscroll-behavior:contain;
}
.message-row { display:flex; width:100%; }
.message-row.own { justify-content:flex-end; }
.bubble {
  max-width:87%;
  min-width:65px;
  padding:10px 12px;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:17px;
}
.message-row.own .bubble {
  background:#24584f;
  border-color:#2d7165;
  border-bottom-right-radius:5px;
}
.message-content { white-space:pre-wrap; }
.message-meta {
  margin-top:6px;
  color:#c5d7d4;
  font-size:10px;
  text-align:right;
}
.message-actions {
  display:flex;
  justify-content:flex-end;
  gap:5px;
  margin-top:6px;
}
.message-actions button {
  min-width:30px;
  min-height:29px;
  padding:4px;
  font-size:13px;
}
#composer {
  position:sticky;
  bottom:0;
  display:flex;
  align-items:flex-end;
  gap:7px;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  background:var(--panel);
  border-top:1px solid var(--border);
}
#messageInput {
  flex:1;
  min-width:0;
  min-height:44px;
  max-height:120px;
  resize:none;
  margin:0;
}
#sendButton {
  background:var(--accent);
  color:#10211f;
  font-weight:800;
}
#replyBar {
  padding:9px 14px;
  background:var(--panel2);
  border-left:3px solid var(--accent);
  font-size:13px;
  overflow-wrap:anywhere;
}
.media-preview {
  display:block;
  max-width:100%;
  max-height:360px;
  margin-bottom:7px;
  border-radius:12px;
}
#notice {
  position:fixed;
  z-index:50;
  left:15px;
  right:15px;
  bottom:calc(18px + env(safe-area-inset-bottom));
  max-width:500px;
  margin:auto;
  padding:13px 15px;
  border:1px solid var(--border);
  border-radius:14px;
  background:var(--panel2);
  box-shadow:0 8px 30px #0005;
  overflow-wrap:anywhere;
}
#menuPanel {
  position:absolute;
  z-index:30;
  top:62px;
  right:12px;
  width:220px;
  padding:8px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:0 12px 35px #0006;
}
.menu-item {
  display:block;
  width:100%;
  padding:13px;
  text-align:left;
  color:var(--text);
  background:transparent;
  border:0;
  border-radius:10px;
}
.menu-item:active { background:var(--panel2); }
@media (min-width:760px) {
  body { padding:20px 0; }
  #app {
    min-height:calc(100dvh - 40px);
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
  }
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">♥</div>
      <span>MiniChat <span style="color:var(--accent)">3.0</span></span>
    </div>
    <button id="menuButton" class="icon-btn" type="button" aria-label="Меню">☰</button>
  </header>

  <div id="menuPanel" class="hidden">
    <button class="menu-item" id="menuChats" type="button">💬 Мои чаты</button>
    <button class="menu-item" id="menuProfile" type="button">👤 Мой профиль</button>
    <button class="menu-item" id="menuRefresh" type="button">🔄 Обновить чаты</button>
    <button class="menu-item" id="menuLogout" type="button">↪ Выйти</button>
  </div>

  <main>
    <section id="loginScreen" class="card">
      <h2>С возвращением ❤️</h2>
      <p class="muted">Твоя личная переписка в MiniChat.</p>
      <form id="loginForm">
        <input id="email" class="field" type="email"
          placeholder="Электронная почта" autocomplete="email" required>
        <input id="password" class="field" type="password"
          placeholder="Пароль" autocomplete="current-password" required>
        <button id="loginButton" class="primary-btn" type="submit">Войти</button>
      </form>
      <p id="loginStatus" class="muted" role="status"></p>
    </section>

    <section id="chatScreen" class="hidden">
      <div id="chatList">
        <div class="section-title">Мои чаты</div>
        <div id="chatItems"></div>
      </div>

      <section id="conversation" class="hidden">
        <div id="chatHeader">
          <button id="backButton" class="icon-btn" type="button">‹</button>
          <div class="avatar" id="headerAvatar">❤️</div>
          <div id="headerInfo">
            <div id="headerTitle">Чат</div>
            <div id="headerStatus">MiniChat</div>
          </div>
          <button id="chatMenuButton" class="icon-btn" type="button">⋮</button>
        </div>
        <div id="messages"></div>
        <div id="replyBar" class="hidden"></div>
        <div id="composer"></div>
      </section>
    </section>

    <section id="profilePanel" class="card hidden"></section>
  </main>
</div>

<div id="notice" class="hidden" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

const SUPABASE_URL = "https://gjqpucsbfuoqoncmdfbj.supabase.co";
const SUPABASE_KEY = "sb_publishable_S1M6veMpHEUzwpA0HeYwlw_IkQYqIzr";
const MEDIA_BUCKET = "chat-media";

const sb = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

let currentUser = null;
let currentProfile = null;
let activeChat = null;
let chatList = [];
let messageList = [];
let realtimeChannel = null;
let noticeTimer = null;
let replyToMessage = null;
let editingMessageId = null;
let mediaRecorder = null;
let recordedChunks = [];
let attachmentBusy = false;

const $ = id => document.getElementById(id);

function showNotice(message) {
  const box = $("notice");
  box.textContent = String(message || "");
  box.classList.remove("hidden");
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => {
    box.classList.add("hidden");
  }, 4000);
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function setLoginStatus(message) {
  $("loginStatus").textContent = message || "";
}

function setLoggedIn(loggedIn) {
  $("loginScreen").classList.toggle("hidden", loggedIn);
  $("chatScreen").classList.toggle("hidden", !loggedIn);
  if (!loggedIn) $("profilePanel").classList.add("hidden");
}
</script>

<script>
/* MiniChat 3.0 — авторизация и список чатов */

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();

  const email = $("email").value.trim();
  const password = $("password").value;
  const button = $("loginButton");

  if (!email || !password) {
    setLoginStatus("Введи почту и пароль.");
    return;
  }

  button.disabled = true;
  button.textContent = "Входим...";
  setLoginStatus("Проверяем данные...");

  try {
    const { data, error } = await sb.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;
    if (!data.user) throw new Error("Аккаунт не найден.");

    await initializeUser(data.user);
  } catch (error) {
    console.error("MiniChat login:", error);
    setLoginStatus("Ошибка входа: " + error.message);
  } finally {
    button.disabled = false;
    button.textContent = "Войти";
  }
});

async function initializeUser(user) {
  currentUser = user;
  setLoggedIn(true);
  setLoginStatus("");

  await loadProfile();
  await loadChats();
}

async function loadProfile() {
  if (!currentUser) return;

  const { data, error } = await sb
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error) {
    console.error("Profile:", error);
    currentProfile = {
      id: currentUser.id,
      username: currentUser.email?.split("@")[0] || "Пользователь"
    };
    return;
  }

  currentProfile = data || {
    id: currentUser.id,
    username: currentUser.email?.split("@")[0] || "Пользователь",
    avatar_url: null,
    status_text: ""
  };
}

async function loadChats() {
  if (!currentUser) return;

  $("chatItems").replaceChildren();

  const loading = document.createElement("div");
  loading.className = "card muted";
  loading.textContent = "Загружаем чаты...";
  $("chatItems").appendChild(loading);

  const { data, error } = await sb
    .from("chat_members")
    .select("chat_id, chats(*)")
    .eq("user_id", currentUser.id);

  if (error) {
    console.error("Chats:", error);
    $("chatItems").replaceChildren();

    const errorBox = document.createElement("div");
    errorBox.className = "card";
    errorBox.textContent =
      "Не удалось загрузить чаты: " + error.message;
    $("chatItems").appendChild(errorBox);
    return;
  }

  chatList = (data || [])
    .map(row => row.chats)
    .filter(Boolean);

  renderChatList();
}

function renderChatList() {
  const container = $("chatItems");
  container.replaceChildren();

  if (!chatList.length) {
    const empty = document.createElement("div");
    empty.className = "card muted";
    empty.textContent =
      "Чатов пока нет. Проверь участников в таблице chat_members.";
    container.appendChild(empty);
    return;
  }

  chatList.forEach(chat => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "chat-item";

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = chat.is_group ? "👥" : "❤️";

    const info = document.createElement("div");
    info.className = "chat-info";

    const name = document.createElement("div");
    name.className = "chat-name";
    name.textContent = chat.title || "Наш чат";

    const preview = document.createElement("div");
    preview.className = "chat-preview";
    preview.textContent = "Открыть переписку";

    info.append(name, preview);
    button.append(avatar, info);

    button.addEventListener("click", () => openChat(chat));
    container.appendChild(button);
  });
}

/* Главное меню */
$("menuButton").addEventListener("click", () => {
  $("menuPanel").classList.toggle("hidden");
});

$("menuChats").addEventListener("click", () => {
  $("menuPanel").classList.add("hidden");
  $("profilePanel").classList.add("hidden");
  $("conversation").classList.add("hidden");
  $("chatList").classList.remove("hidden");
});

$("menuProfile").addEventListener("click", () => {
  $("menuPanel").classList.add("hidden");
  showProfile();
});

$("menuRefresh").addEventListener("click", async () => {
  $("menuPanel").classList.add("hidden");
  await loadChats();
  showNotice("Список чатов обновлён.");
});

$("menuLogout").addEventListener("click", async () => {
  $("menuPanel").classList.add("hidden");

  if (!confirm("Выйти из MiniChat?")) return;

  const { error } = await sb.auth.signOut();

  if (error) {
    showNotice("Ошибка выхода: " + error.message);
  }
});

/* Восстановление существующей сессии */
sb.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT") {
    currentUser = null;
    currentProfile = null;
    activeChat = null;
    chatList = [];
    messageList = [];

    if (realtimeChannel) {
      sb.removeChannel(realtimeChannel);
      realtimeChannel = null;
    }

    setLoggedIn(false);
    $("email").value = "";
    $("password").value = "";
    setLoginStatus("");
  }
});

async function restoreMiniChatSession() {
  try {
    const { data, error } = await sb.auth.getSession();
    if (error) throw error;

    if (data.session?.user) {
      await initializeUser(data.session.user);
    } else {
      setLoggedIn(false);
    }
  } catch (error) {
    console.error("Session:", error);
    setLoggedIn(false);
    setLoginStatus("Не удалось восстановить вход.");
  }
}

restoreMiniChatSession();
</script>

<script>
/* MiniChat 3.0 — переписка и текстовые сообщения */

async function openChat(chat) {
  activeChat = chat;

  $("chatList").classList.add("hidden");
  $("conversation").classList.remove("hidden");
  $("profilePanel").classList.add("hidden");

  const title = $("conversationTitle");
  if (title) title.textContent = chat.title || "Наш чат";

  const subtitle = $("conversationSubtitle");
  if (subtitle) subtitle.textContent = "MiniChat";

  await loadMessages();
  subscribeToMessages();
}

async function loadMessages() {
  if (!activeChat || !currentUser) return;

  const container = $("messageList");
  container.replaceChildren();

  const loading = document.createElement("div");
  loading.className = "muted";
  loading.textContent = "Загружаем сообщения...";
  container.appendChild(loading);

  const { data, error } = await sb
    .from("messages")
    .select("*")
    .eq("chat_id", activeChat.id)
    .is("deleted_at", null)
    .order("created_at", { ascending: true });

  if (error) {
    console.error("Messages:", error);
    container.replaceChildren();

    const errorBox = document.createElement("div");
    errorBox.className = "card";
    errorBox.textContent =
      "Не удалось загрузить сообщения: " + error.message;
    container.appendChild(errorBox);
    return;
  }

  messageList = data || [];
  renderMessages();

  container.scrollTop = container.scrollHeight;
}

function renderMessages() {
  const container = $("messageList");
  container.replaceChildren();

  if (!messageList.length) {
    const empty = document.createElement("div");
    empty.className = "muted empty-messages";
    empty.textContent = "Пока нет сообщений. Напиши первым ❤️";
    container.appendChild(empty);
    return;
  }

  messageList.forEach(message => {
    const own = message.sender_id === currentUser?.id;

    const row = document.createElement("div");
    row.className = "message-row " + (own ? "message-own" : "message-other");

    const bubble = document.createElement("div");
    bubble.className = "message-bubble";

    if (message.is_pinned) {
      const pinned = document.createElement("div");
      pinned.className = "message-pinned";
      pinned.textContent = "📌 Закреплено";
      bubble.appendChild(pinned);
    }

    if (message.reply_to_id) {
      const reply = messageList.find(
        item => item.id === message.reply_to_id
      );

      if (reply) {
        const replyBox = document.createElement("div");
        replyBox.className = "message-reply";
        replyBox.textContent =
          "↪ " + (reply.content || "Вложение");
        bubble.appendChild(replyBox);
      }
    }

    if (message.content) {
      const content = document.createElement("div");
      content.className = "message-content";
      content.textContent = message.content;
      bubble.appendChild(content);
    }

    if (message.image_url) {
      const image = document.createElement("img");
      image.className = "message-image";
      image.src = message.image_url;
      image.alt = "Изображение";
      image.loading = "lazy";
      image.addEventListener("click", () => {
        window.open(message.image_url, "_blank", "noopener");
      });
      bubble.appendChild(image);
    }

    if (message.file_url) {
      const file = document.createElement("a");
      file.className = "message-file";
      file.href = message.file_url;
      file.target = "_blank";
      file.rel = "noopener noreferrer";
      file.textContent = "📎 " + (message.file_name || "Открыть файл");
      bubble.appendChild(file);
    }

    const footer = document.createElement("div");
    footer.className = "message-footer";

    const time = document.createElement("span");
    time.textContent = message.created_at
      ? new Date(message.created_at).toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        })
      : "";

    footer.appendChild(time);

    if (message.edited_at) {
      const edited = document.createElement("span");
      edited.textContent = " изменено";
      footer.appendChild(edited);
    }

    if (own && message.read_at) {
      const read = document.createElement("span");
      read.textContent = " · ✓✓";
      read.title = "Прочитано";
      footer.appendChild(read);
    }

    bubble.appendChild(footer);

    const actions = document.createElement("div");
    actions.className = "message-actions";

    const replyButton = document.createElement("button");
    replyButton.type = "button";
    replyButton.textContent = "↩";
    replyButton.title = "Ответить";
    replyButton.addEventListener("click", () => {
      replyToMessage = message;
      const input = $("messageInput");
      input.focus();
      showNotice("Ответ на сообщение выбран.");
    });
    actions.appendChild(replyButton);

    if (own && message.content && !message.deleted_at) {
      const editButton = document.createElement("button");
      editButton.type = "button";
      editButton.textContent = "✎";
      editButton.title = "Редактировать";
      editButton.addEventListener("click", () => {
        editingMessageId = message.id;
        $("messageInput").value = message.content;
        $("messageInput").focus();
        showNotice("Измени текст и нажми отправить.");
      });
      actions.appendChild(editButton);
    }

    const pinButton = document.createElement("button");
    pinButton.type = "button";
    pinButton.textContent = message.is_pinned ? "📌" : "📍";
    pinButton.title = message.is_pinned ? "Открепить" : "Закрепить";
    pinButton.addEventListener("click", () => togglePinMessage(message));
    actions.appendChild(pinButton);

    bubble.appendChild(actions);
    row.appendChild(bubble);
    container.appendChild(row);
  });
}

async function sendMessage() {
  if (!currentUser || !activeChat) {
    showNotice("Сначала открой чат.");
    return;
  }

  const input = $("messageInput");
  const content = input.value.trim();

  if (!content) {
    showNotice("Напиши сообщение.");
    return;
  }

  const button = $("sendButton");
  button.disabled = true;

  try {
    if (editingMessageId) {
      const { error } = await sb
        .from("messages")
        .update({
          content,
          edited_at: new Date().toISOString()
        })
        .eq("id", editingMessageId)
        .eq("sender_id", currentUser.id);

      if (error) throw error;

      editingMessageId = null;
    } else {
      const newMessage = {
        chat_id: activeChat.id,
        sender_id: currentUser.id,
        content,
        message_type: "text",
        reply_to_id: replyToMessage?.id || null
      };

      const { error } = await sb
        .from("messages")
        .insert(newMessage);

      if (error) throw error;

      replyToMessage = null;
    }

    input.value = "";
    await loadMessages();
  } catch (error) {
    console.error("Send message:", error);
    showNotice("Не удалось отправить: " + error.message);
  } finally {
    button.disabled = false;
    input.focus();
  }
}

$("sendButton").addEventListener("click", sendMessage);

$("messageInput").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

async function togglePinMessage(message) {
  if (!currentUser || !activeChat) return;

  try {
    const { error } = await sb
      .from("messages")
      .update({ is_pinned: !message.is_pinned })
      .eq("id", message.id);

    if (error) throw error;

    await loadMessages();
    showNotice(message.is_pinned ? "Сообщение откреплено." : "Сообщение закреплено.");
  } catch (error) {
    console.error("Pin message:", error);
    showNotice("Не удалось изменить закрепление: " + error.message);
  }
}

function subscribeToMessages() {
  if (!activeChat) return;

  if (realtimeChannel) {
    sb.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }

  realtimeChannel = sb
    .channel("minichat-messages-" + activeChat.id)
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "messages",
        filter: "chat_id=eq." + activeChat.id
      },
      async payload => {
        if (payload.eventType === "INSERT") {
          const incoming = payload.new;

          if (incoming.sender_id !== currentUser?.id) {
            await markMessageRead(incoming);
          }
        }

        await loadMessages();
      }
    )
    .subscribe(status => {
      if (status === "CHANNEL_ERROR") {
        console.warn("MiniChat Realtime: ошибка подписки.");
      }
    });
}

async function markMessageRead(message) {
  if (!currentUser || !message?.id) return;
  if (message.sender_id === currentUser.id) return;
  if (message.read_at) return;

  const { error } = await sb
    .from("messages")
    .update({ read_at: new Date().toISOString() })
    .eq("id", message.id)
    .is("read_at", null);

  if (error) {
    console.warn("Не удалось отметить сообщение прочитанным:", error);
  }
}
</script>

<script>
/* MiniChat 3.0 — фотографии и файлы */

async function uploadChatAttachment(file) {
  if (!currentUser || !activeChat || !file) {
    showNotice("Сначала открой чат.");
    return;
  }

  if (file.size > 15 * 1024 * 1024) {
    showNotice("Максимальный размер файла — 15 МБ.");
    return;
  }

  if (attachmentBusy) return;
  attachmentBusy = true;

  try {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path =
      activeChat.id + "/" +
      currentUser.id + "/" +
      Date.now() + "_" + safeName;

    showNotice("Загружаем файл...");

    const { data: uploaded, error: uploadError } = await sb.storage
      .from(MEDIA_BUCKET)
      .upload(path, file, {
        cacheControl: "3600",
        upsert: false,
        contentType: file.type || "application/octet-stream"
      });

    if (uploadError) throw uploadError;

    const { data: publicData } = sb.storage
      .from(MEDIA_BUCKET)
      .getPublicUrl(uploaded.path);

    const isImage = file.type.startsWith("image/");

    const newMessage = {
      chat_id: activeChat.id,
      sender_id: currentUser.id,
      content: "",
      message_type: isImage ? "image" : "file",
      media_path: uploaded.path,
      file_name: file.name,
      mime_type: file.type || null
    };

    if (isImage) {
      newMessage.image_url = publicData.publicUrl;
    } else {
      newMessage.file_url = publicData.publicUrl;
    }

    const { error: messageError } = await sb
      .from("messages")
      .insert(newMessage);

    if (messageError) throw messageError;

    await loadMessages();
    showNotice("Файл отправлен!");
  } catch (error) {
    console.error("Attachment upload:", error);
    showNotice("Не удалось отправить файл: " + error.message);
  } finally {
    attachmentBusy = false;
    $("attachmentInput").value = "";
  }
}

$("attachmentButton").addEventListener("click", () => {
  $("attachmentInput").click();
});

$("attachmentInput").addEventListener("change", async event => {
  const files = Array.from(event.target.files || []);

  for (const file of files) {
    await uploadChatAttachment(file);
  }
});

/* Кнопка назад к списку чатов */
$("backButton").addEventListener("click", () => {
  if (realtimeChannel) {
    sb.removeChannel(realtimeChannel);
    realtimeChannel = null;
  }

  activeChat = null;
  $("conversation").classList.add("hidden");
  $("chatList").classList.remove("hidden");
});

/* Сохранение изменений профиля */
async function showProfile() {
  $("profilePanel").classList.remove("hidden");
  $("chatList").classList.add("hidden");
  $("conversation").classList.add("hidden");

  if (!currentProfile) await loadProfile();

  $("profileUsername").value = currentProfile?.username || "";
  $("profileStatus").value = currentProfile?.status_text || "";
  $("profileAvatar").src = currentProfile?.avatar_url || "";
}

$("profileSaveButton").addEventListener("click", async () => {
  if (!currentUser) return;

  const username = $("profileUsername").value.trim();
  const status_text = $("profileStatus").value.trim();

  if (!username) {
    showNotice("Имя не должно быть пустым.");
    return;
  }

  try {
    const { error } = await sb
      .from("profiles")
      .upsert({
        id: currentUser.id,
        username,
        status_text
      }, {
        onConflict: "id"
      });

    if (error) throw error;

    currentProfile = {
      ...currentProfile,
      id: currentUser.id,
      username,
      status_text
    };

    showNotice("Профиль сохранён.");
    await loadChats();
  } catch (error) {
    console.error("Profile save:", error);
    showNotice("Не удалось сохранить профиль: " + error.message);
  }
});

/* Загрузка аватара */
$("avatarInput").addEventListener("change", async event => {
  const file = event.target.files?.[0];
  if (!file || !currentUser) return;

  if (!file.type.startsWith("image/")) {
    showNotice("Выбери изображение.");
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    showNotice("Аватар должен быть не больше 5 МБ.");
    return;
  }

  try {
    const path = "avatars/" + currentUser.id + "/" + Date.now() +
      "_" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

    const { data, error } = await sb.storage
      .from(MEDIA_BUCKET)
      .upload(path, file, {
        upsert: false,
        contentType: file.type
      });

    if (error) throw error;

    const { data: publicData } = sb.storage
      .from(MEDIA_BUCKET)
      .getPublicUrl(data.path);

    const { error: profileError } = await sb
      .from("profiles")
      .upsert({
        id: currentUser.id,
        username: currentProfile?.username ||
          currentUser.email?.split("@")[0] || "Пользователь",
        avatar_url: publicData.publicUrl,
        avatar_path: data.path
      }, {
        onConflict: "id"
      });

    if (profileError) throw profileError;

    await loadProfile();
    $("profileAvatar").src = currentProfile.avatar_url;
    showNotice("Аватар обновлён.");
  } catch (error) {
    console.error("Avatar upload:", error);
    showNotice("Не удалось загрузить аватар: " + error.message);
  } finally {
    $("avatarInput").value = "";
  }
});
</script>

<script>
/* MiniChat 3.0 — финальная проверка интерфейса */

(function setupMiniChatFinal() {
  const requiredIds = [
    "loginForm",
    "email",
    "password",
    "loginButton",
    "chatItems",
    "chatList",
    "conversation",
    "conversationTitle",
    "messageList",
    "messageInput",
    "sendButton",
    "attachmentButton",
    "attachmentInput",
    "backButton",
    "profilePanel",
    "profileUsername",
    "profileStatus",
    "profileAvatar",
    "profileSaveButton",
    "avatarInput",
    "menuButton",
    "menuPanel",
    "menuChats",
    "menuProfile",
    "menuRefresh",
    "menuLogout"
  ];

  const missing = requiredIds.filter(id => !$(id));
alert("Не найдены элементы: " + missing.join(", "));

  if (missing.length) {
    console.error(
      "MiniChat 3.0: не найдены HTML-элементы:",
      missing
    );
    showNotice("Ошибка интерфейса. Проверь консоль и HTML-элементы.");
  }

  if (!$("notice")) {
    const notice = document.createElement("div");
    notice.id = "notice";
    notice.className = "hidden";
    notice.setAttribute("role", "status");
    notice.setAttribute("aria-live", "polite");
    document.body.appendChild(notice);
  }

  if (!$("profileAvatar").getAttribute("src")) {
    $("profileAvatar").alt = "Аватар профиля";
  }

  console.log("MiniChat 3.0: проверка интерфейса завершена.");
})();
</script>
