<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<title>MiniChat ❤️</title>
<style>
*{box-sizing:border-box}
:root{--bg:#17212b;--panel:#242f3d;--blue:#3390ec;--mine:#2b5278;--muted:#9aafc1}
body{margin:0;background:var(--bg);color:white;font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
button{border:0;border-radius:12px;background:var(--blue);color:white;padding:11px 14px;cursor:pointer}
button:disabled{opacity:.5}
input,textarea{border:0;border-radius:12px;padding:12px;min-width:0;background:#fff;color:#111}
header{display:flex;align-items:center;gap:10px;padding:12px;background:var(--panel);min-height:68px}
#topAvatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#526477}
.brand{font-size:21px;font-weight:bold}
.small{font-size:12px;color:var(--muted);margin-top:4px}
#login{max-width:420px;margin:35px auto;padding:20px}
#login input,#login button{display:block;width:100%;margin:9px 0}
#notice{display:none;padding:12px;color:#ffd18b;font-size:13px;overflow-wrap:anywhere}
#profilePanel{display:none;background:#1e2a37;padding:12px;gap:8px;flex-wrap:wrap}
#profilePanel input{width:100%;flex:1}
#profilePanel button{font-size:13px}
#chatList{display:none;padding:12px;max-width:700px;margin:auto}
.chat-item{display:flex;align-items:center;gap:12px;width:100%;padding:13px;margin:6px 0;text-align:left;background:var(--panel);border-radius:14px;color:white}
.chat-circle{width:48px;height:48px;flex-shrink:0;border-radius:50%;background:#3390ec;display:flex;align-items:center;justify-content:center;font-size:22px}
.chat-details{flex:1;min-width:0}
.chat-title{font-weight:bold;font-size:16px}
.chat-preview{color:var(--muted);font-size:13px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#backButton{display:none;background:#344354}
#messages{height:calc(100dvh - 160px);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.line{display:flex;align-items:flex-end;gap:7px;max-width:92%;align-self:flex-start}
.line.mine{align-self:flex-end;flex-direction:row-reverse}
.msgAvatar{width:29px;height:29px;border-radius:50%;object-fit:cover;background:#526477;flex-shrink:0}
.bubble{background:var(--panel);padding:10px 12px;border-radius:15px 15px 15px 4px;overflow-wrap:anywhere;min-width:60px}
.mine .bubble{background:var(--mine);border-radius:15px 15px 4px 15px}
.msgText{white-space:pre-wrap;overflow-wrap:anywhere}
.meta{font-size:10px;color:#c8d8e5;text-align:right;margin-top:6px}
.mediaImage,.mediaVideo{display:block;max-width:min(65vw,320px);max-height:350px;border-radius:9px}
audio{width:min(65vw,270px);height:42px}
#typing{height:19px;padding:0 16px;color:var(--muted);font-size:12px}
#composer{display:none;position:fixed;bottom:0;left:0;right:0;align-items:center;gap:6px;padding:9px 9px calc(9px + env(safe-area-inset-bottom));background:var(--panel)}
#message{flex:1;border-radius:22px;width:40px}
.iconBtn{padding:10px 12px;border-radius:50%;font-size:18px;flex-shrink:0}
#fileInput,#avatarInput{display:none}
#recordStatus{font-size:11px;color:#ffaaaa}
#replyBar{display:none;background:#1e2a37;padding:8px 12px;font-size:12px;color:#c8d8e5}
#replyBar button{padding:5px 9px;background:#344354}
#callPanel{display:none;padding:12px;background:#1e2a37;gap:8px;flex-wrap:wrap}
#callPanel button{flex:1}
.messageActions{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.messageActions button{font-size:11px;padding:6px 8px;background:#344354}
.pinnedBanner{display:none;padding:9px 12px;background:#1e2a37;font-size:12px}
@media(min-width:700px){
 #messages{max-width:850px;margin:auto}
 #composer{padding-left:max(10px,calc((100vw - 830px)/2));padding-right:max(10px,calc((100vw - 830px)/2))}
}
</style>
</head>
<body>
<header>
  <button id="backButton">← Назад</button>
  <img id="topAvatar" alt="Аватар" hidden>
  <div style="flex:1;min-width:0">
    <div class="brand">MiniChat ❤️</div>
    <div class="small" id="status">Личное пространство для двоих</div>
  </div>
  <button id="profileButton" style="display:none">Профиль</button>
  <button id="callButton" style="display:none">📞</button>
</header>

<div id="notice"></div>

<section id="login">
  <h2>MiniChat ❤️</h2>
  <p class="small">Твоя личная переписка с Настей</p>
  <form id="loginForm">
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <button id="loginButton" type="submit">Войти</button>
  </form>
  <p class="small">Войди с существующим аккаунтом.</p>
</section>

<section id="profilePanel">
  <input id="profileName" maxlength="40" placeholder="Твоё имя">
  <input id="profileStatus" maxlength="100" placeholder="Статус">
  <button id="saveProfile">Сохранить</button>
  <button id="chooseAvatar">Изменить аватарку</button>
  <button id="logoutButton" style="background:#596777">Выйти</button>
  <input id="avatarInput" type="file" accept="image/*">
</section>

<section id="chatList"></section>
<div id="pinnedBanner" class="pinnedBanner"></div>
<div id="callPanel"></div>
<div id="replyBar"></div>
<main id="messages" style="display:none"></main>
<div id="typing"></div>

<div id="composer">
  <input id="fileInput" type="file" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt,.zip">
  <button class="iconBtn" id="photoButton" title="Файлы">＋</button>
  <button class="iconBtn" id="recordButton" title="Голосовое">🎙</button>
  <span id="recordStatus"></span>
  <input id="message" placeholder="Сообщение..." autocomplete="off">
  <button class="iconBtn" id="sendButton" title="Отправить">➤</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const SUPABASE_URL = "https://gjqpucsbfuoqoncmdfbj.supabase.co";
const SUPABASE_KEY = "sb_publishable_S1M6veMpHEUzwpA0HeYwlw_IkQYqIzr";
const BUCKET = "chat-media";
const $ = id => document.getElementById(id);

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
});

let currentUser = null;
let chatId = null;
let myProfile = {};
let profiles = {};
let availableChats = [];
let chatChannel = null;
let recorder = null;
let recordingChunks = [];
let recordingStream = null;
let busy = false;
let typingTimer = null;
let replyToId = null;
let replyToText = "";
let editingMessageId = null;
const signedUrls = new Map();

function notice(message) {
  $("notice").textContent = message;
  $("notice").style.display = "block";
}

function clearNotice() {
  $("notice").textContent = "";
  $("notice").style.display = "none";
}

function setStatus(message) {
  $("status").textContent = message;
}

function timeText(value) {
  return value
    ? new Date(value).toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
      })
    : "";
}

async function getMediaUrl(path) {
  if (!path) return "";
  if (signedUrls.has(path)) return signedUrls.get(path);

  const { data, error } = await db.storage
    .from(BUCKET)
    .createSignedUrl(path, 3600);

  if (error) {
    console.error(error.message);
    return "";
  }

  signedUrls.set(path, data.signedUrl);
  return data.signedUrl;
}

async function getProfile(userId) {
  if (profiles[userId]) return profiles[userId];

  const { data, error } = await db
    .from("profiles")
    .select("id,username,avatar_path,status_text,last_seen")
    .eq("id", userId)
    .maybeSingle();

  if (error) console.warn("Профиль:", error.message);

  profiles[userId] = data || {
    id: userId,
    username: "Пользователь",
    avatar_path: null,
    status_text: "",
    last_seen: null
  };

  return profiles[userId];
}

async function refreshMyProfile() {
  const { data, error } = await db
    .from("profiles")
    .select("id,username,avatar_path,status_text,last_seen")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error) throw error;

  if (!data) {
    const { data: created, error: createError } = await db
      .from("profiles")
      .insert({
        id: currentUser.id,
        username: (currentUser.email || "user").split("@")[0],
        status_text: ""
      })
      .select()
      .single();

    if (createError) throw createError;
    myProfile = created;
  } else {
    myProfile = data;
  }

  profiles[currentUser.id] = myProfile;
  $("profileName").value = myProfile.username || "";
  $("profileStatus").value = myProfile.status_text || "";

  if (myProfile.avatar_path) {
    const url = await getMediaUrl(myProfile.avatar_path);
    if (url) {
      $("topAvatar").src = url;
      $("topAvatar").hidden = false;
    }
  } else {
    $("topAvatar").hidden = true;
  }
}

async function startLogin(event) {
  event.preventDefault();

  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password) return;

  $("loginButton").disabled = true;
  $("loginButton").textContent = "Входим...";
  clearNotice();

  const { data, error } = await db.auth.signInWithPassword({
    email,
    password
  });

  $("loginButton").disabled = false;
  $("loginButton").textContent = "Войти";

  if (error) {
    notice("Ошибка входа: " + error.message);
    return;
  }

  await openChat(data.user);
}

async function openChat(user) {
  if (busy) return;
  busy = true;
  currentUser = user;
  clearNotice();
  setStatus("Загружаем чаты...");

  try {
    const { data, error } = await db
      .from("chat_members")
      .select("chat_id")
      .eq("user_id", currentUser.id);

    if (error) throw error;
    if (!data || data.length === 0) {
      throw new Error("Аккаунт не добавлен в chat_members.");
    }

    availableChats = [...new Set(data.map(item => item.chat_id))];

    await refreshMyProfile();

    $("login").style.display = "none";
    $("messages").style.display = "none";
    $("chatList").style.display = "block";
    $("composer").style.display = "none";
    $("typing").textContent = "";
    $("backButton").style.display = "none";
    $("profileButton").style.display = "block";
    $("callButton").style.display = "none";
    $("profilePanel").style.display = "none";
    $("pinnedBanner").style.display = "none";
    $("callPanel").style.display = "none";
    $("replyBar").style.display = "none";

    setStatus("Твои переписки ❤️");
    await renderChatList();
  } catch (error) {
    console.error(error);
    notice("Не удалось загрузить чаты: " + error.message);
    setStatus("Ошибка загрузки");
  } finally {
    busy = false;
  }
}

async function renderChatList() {
  const list = $("chatList");
  list.innerHTML = "";

  for (const id of availableChats) {
    const { data, error } = await db
      .from("messages")
      .select("content,message_type,created_at,deleted_at")
      .eq("chat_id", id)
      .order("created_at", { ascending: false })
      .limit(1);

    if (error) console.warn(error.message);

    const last = data && data.length ? data[0] : null;
    const item = document.createElement("button");
    item.className = "chat-item";

    const circle = document.createElement("div");
    circle.className = "chat-circle";
    circle.textContent = "❤️";

    const details = document.createElement("div");
    details.className = "chat-details";

    const title = document.createElement("div");
    title.className = "chat-title";
    title.textContent = "Личный чат с Настей";

    const preview = document.createElement("div");
    preview.className = "chat-preview";

    if (!last) {
      preview.textContent = "Начните общение ❤️";
    } else if (last.deleted_at) {
      preview.textContent = "Сообщение удалено";
    } else if (last.message_type === "image") {
      preview.textContent = "📷 Фото";
    } else if (last.message_type === "video") {
      preview.textContent = "🎬 Видео";
    } else if (last.message_type === "audio") {
      preview.textContent = "🎙 Голосовое сообщение";
    } else if (last.message_type === "file") {
      preview.textContent = "📎 Файл";
    } else {
      preview.textContent = last.content || "Сообщение";
    }

    details.appendChild(title);
    details.appendChild(preview);
    item.appendChild(circle);
    item.appendChild(details);
    item.addEventListener("click", () => openSelectedChat(id));
    list.appendChild(item);
  }

  if (availableChats.length === 0) {
    list.textContent = "Пока нет доступных чатов.";
  }
}

async function openSelectedChat(id) {
  if (busy) return;
  busy = true;

  try {
    chatId = id;
    clearNotice();

    $("chatList").style.display = "none";
    $("messages").style.display = "flex";
    $("composer").style.display = "flex";
    $("backButton").style.display = "block";
    $("callButton").style.display = "block";
    $("messages").innerHTML = "";
    $("typing").textContent = "";
    setStatus("Открываем переписку...");

    await loadMessages();
    await markRead();
    await subscribeChat();
    await showPinnedMessage();

    setStatus(myProfile.status_text || "Ваш личный чат ❤️");
  } catch (error) {
    notice("Не удалось открыть чат: " + error.message);
  } finally {
    busy = false;
  }
}

async function returnToChatList() {
  $("messages").style.display = "none";
  $("composer").style.display = "none";
  $("chatList").style.display = "block";
  $("backButton").style.display = "none";
  $("callButton").style.display = "none";
  $("typing").textContent = "";
  $("pinnedBanner").style.display = "none";
  $("callPanel").style.display = "none";
  $("replyBar").style.display = "none";
  setStatus("Твои переписки ❤️");

  if (chatChannel) {
    await db.removeChannel(chatChannel);
    chatChannel = null;
  }

  chatId = null;
  replyToId = null;
  editingMessageId = null;
  await renderChatList();
}

async function loadMessages() {
  const { data, error } = await db
    .from("messages")
    .select("*")
    .eq("chat_id", chatId)
    .order("created_at", { ascending: true });

  if (error) throw error;

  const list = $("messages");
  list.innerHTML = "";

  for (const message of (data || [])) {
    await showMessage(message);
  }

  list.scrollTop = list.scrollHeight;
}

async function showMessage(message) {
  if (!message || !currentUser) return;

  const list = $("messages");
  const existing = list.querySelector(
    '[data-id="' + message.id + '"]'
  );

  if (existing) existing.remove();

  const mine = message.sender_id === currentUser.id;
  const profile = await getProfile(message.sender_id);

  const line = document.createElement("div");
  line.className = "line" + (mine ? " mine" : "");
  line.dataset.id = message.id;

  const avatar = document.createElement("img");
  avatar.className = "msgAvatar";
  avatar.alt = "";
  avatar.src = "";

  if (profile.avatar_path) {
    avatar.src = await getMediaUrl(profile.avatar_path);
  }

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  const name = document.createElement("div");
  name.className = "small";
  name.textContent = mine
    ? "Ты"
    : (profile.username || "Пользователь");

  bubble.appendChild(name);

  if (message.reply_to_id) {
    const reply = document.createElement("div");
    reply.style.cssText =
      "border-left:3px solid #3390ec;padding:5px 8px;" +
      "margin:6px 0;background:#17212b;border-radius:5px;" +
      "font-size:12px;color:#c8d8e5";
    reply.textContent = "↪ Ответ на сообщение";
    bubble.appendChild(reply);
  }

  if (message.deleted_at) {
    const deleted = document.createElement("div");
    deleted.className = "msgText";
    deleted.style.fontStyle = "italic";
    deleted.textContent = "Это сообщение удалено";
    bubble.appendChild(deleted);
  } else if (
    message.message_type === "image" &&
    message.media_path
  ) {
    const url = await getMediaUrl(message.media_path);
    if (url) {
      const img = document.createElement("img");
      img.className = "mediaImage";
      img.src = url;
      img.alt = "Фото";
      img.loading = "lazy";
      bubble.appendChild(img);
    }
  } else if (
    message.message_type === "video" &&
    message.media_path
  ) {
    const url = await getMediaUrl(message.media_path);
    if (url) {
      const video = document.createElement("video");
      video.className = "mediaVideo";
      video.src = url;
      video.controls = true;
      video.playsInline = true;
      bubble.appendChild(video);
    }
  } else if (
    message.message_type === "audio" &&
    message.media_path
  ) {
    const url = await getMediaUrl(message.media_path);
    if (url) {
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.src = url;
      bubble.appendChild(audio);
    }
  } else if (
    message.message_type === "file" &&
    message.media_path
  ) {
    const url = await getMediaUrl(message.media_path);
    if (url) {
      const link = document.createElement("a");
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener";
      link.style.color = "#8cc7ff";
      link.textContent = "📎 " +
        (message.file_name || "Открыть файл");
      bubble.appendChild(link);
    }
  } else {
    const text = document.createElement("div");
    text.className = "msgText";

    let content = String(message.content || "");
    if (message.forwarded_from_id) {
      content = "↪ Пересланное сообщение\n" + content;
    }

    text.textContent = content;
    bubble.appendChild(text);
  }

  if (message.is_pinned && !message.deleted_at) {
    const pinned = document.createElement("div");
    pinned.className = "small";
    pinned.textContent = "📌 Закреплено";
    bubble.appendChild(pinned);
  }

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = timeText(message.created_at);

  if (message.edited_at && !message.deleted_at) {
    meta.textContent += " · изменено";
  }

  if (mine) {
    meta.textContent += message.read_at ? " ✓✓" : " ✓";
  }

  bubble.appendChild(meta);

  if (!message.deleted_at) {
    const actions = document.createElement("div");
    actions.className = "messageActions";

    function addAction(label, callback) {
      const button = document.createElement("button");
      button.textContent = label;
      button.addEventListener("click", callback);
      actions.appendChild(button);
    }

    addAction("↩ Ответить", () => prepareReply(message));

    if (mine && message.message_type === "text") {
      addAction("✏️ Изменить", () => editMessage(message));
    }

    if (mine) {
      addAction("🗑 Удалить", () => deleteMessage(message));
    }

    addAction("↗ Переслать", () => forwardMessage(message));

    addAction(
      message.is_pinned ? "Открепить" : "📌 Закрепить",
      () => togglePin(message)
    );

    bubble.appendChild(actions);
  }

  line.appendChild(avatar);
  line.appendChild(bubble);
  list.appendChild(line);
  list.scrollTop = list.scrollHeight;
}

async function sendMessage() {
  const input = $("message");
  const content = input.value.trim();

  if (!content || !currentUser || !chatId) return;

  if (editingMessageId) {
    const id = editingMessageId;

    const { error } = await db
      .from("messages")
      .update({
        content,
        edited_at: new Date().toISOString()
      })
      .eq("id", id)
      .eq("sender_id", currentUser.id)
      .eq("chat_id", chatId);

    if (error) {
      notice("Не удалось изменить сообщение: " + error.message);
      return;
    }

    editingMessageId = null;
    input.value = "";
    input.placeholder = "Сообщение...";
    clearReply();
    clearNotice();
    return;
  }

  const newMessage = {
    chat_id: chatId,
    sender_id: currentUser.id,
    content,
    message_type: "text"
  };

  if (replyToId) {
    newMessage.reply_to_id = replyToId;
  }

  $("sendButton").disabled = true;

  const { error } = await db.from("messages").insert(newMessage);

  $("sendButton").disabled = false;

  if (error) {
    notice("Не удалось отправить: " + error.message);
    return;
  }

  input.value = "";
  clearReply();
  clearNotice();
}

function prepareReply(message) {
  replyToId = message.id;

  replyToText = message.deleted_at
    ? "Удалённое сообщение"
    : (message.content || message.file_name || "Вложение");

  $("replyBar").innerHTML = "";

  const label = document.createElement("span");
  label.textContent = "Ответ на: " + replyToText;
  label.style.flex = "1";

  const cancel = document.createElement("button");
  cancel.textContent = "✕";
  cancel.addEventListener("click", clearReply);

  $("replyBar").appendChild(label);
  $("replyBar").appendChild(cancel);
  $("replyBar").style.display = "flex";
  $("message").focus();
}

function clearReply() {
  replyToId = null;
  replyToText = "";
  $("replyBar").style.display = "none";
  $("replyBar").innerHTML = "";
}

async function editMessage(message) {
  if (message.sender_id !== currentUser.id) return;
  if (message.message_type !== "text") {
    notice("Редактировать можно только текстовые сообщения.");
    return;
  }

  editingMessageId = message.id;
  clearReply();

  $("message").value = message.content || "";
  $("message").placeholder = "Измени текст и нажми ➤";
  $("message").focus();
}

async function deleteMessage(message) {
  if (message.sender_id !== currentUser.id) {
    notice("Удалять можно только свои сообщения.");
    return;
  }

  if (!confirm("Удалить это сообщение?")) return;

  const { error } = await db
    .from("messages")
    .update({
      deleted_at: new Date().toISOString(),
      content: "Сообщение удалено",
      media_path: null,
      file_name: null
    })
    .eq("id", message.id)
    .eq("sender_id", currentUser.id)
    .eq("chat_id", chatId);

  if (error) {
    notice("Ошибка удаления: " + error.message);
    return;
  }

  clearNotice();
}

async function forwardMessage(message) {
  if (!availableChats.length) return;

  const choices = availableChats
    .filter(id => id !== chatId);

  if (!choices.length) {
    notice("Для пересылки в другую переписку пока нет другого чата.");
    return;
  }

  const menu = choices.map((id, index) =>
    (index + 1) + ". Личный чат " + id.slice(0, 8)
  ).join("\n");

  const answer = prompt(
    "Куда переслать?\n" + menu + "\nВведи номер чата:"
  );

  if (answer === null) return;

  const index = Number(answer) - 1;
  if (!Number.isInteger(index) || index < 0 || index >= choices.length) {
    notice("Неверный номер чата.");
    return;
  }

  const targetChat = choices[index];

  const { error } = await db.from("messages").insert({
    chat_id: targetChat,
    sender_id: currentUser.id,
    content: message.content || message.file_name || "Вложение",
    message_type: "text",
    forwarded_from_id: message.id
  });

  if (error) {
    notice("Ошибка пересылки: " + error.message);
  } else {
    notice("Сообщение переслано ❤️");
  }
}

async function togglePin(message) {
  const { data, error } = await db.rpc(
    "toggle_pin_message",
    { p_message_id: message.id }
  );

  if (error) {
    notice("Не удалось закрепить: " + error.message);
    return;
  }

  notice(data ? "Сообщение закреплено 📌" : "Сообщение откреплено");
  await showPinnedMessage();
}

async function showPinnedMessage() {
  if (!chatId) return;

  const { data, error } = await db
    .from("messages")
    .select("id,content,created_at")
    .eq("chat_id", chatId)
    .eq("is_pinned", true)
    .is("deleted_at", null)
    .order("created_at", { ascending: false })
    .limit(1);

  if (error) {
    console.warn("Закреплённое сообщение:", error.message);
    return;
  }

  const banner = $("pinnedBanner");

  if (data && data.length) {
    banner.textContent = "📌 Закреплено: " +
      (data[0].content || "Сообщение");
    banner.style.display = "block";
  } else {
    banner.textContent = "";
    banner.style.display = "none";
  }
}

async function markRead() {
  if (!chatId || !currentUser) return;

  const { error } = await db.rpc("mark_chat_read", {
    p_chat_id: chatId
  });

  if (error) console.warn("Отметка прочтения:", error.message);
}

async function subscribeChat() {
  if (chatChannel) {
    await db.removeChannel(chatChannel);
    chatChannel = null;
  }

  chatChannel = db.channel("minichat-" + chatId);

  chatChannel.on(
    "postgres_changes",
    {
      event: "*",
      schema: "public",
      table: "messages",
      filter: "chat_id=eq." + chatId
    },
    async payload => {
      if (payload.eventType === "INSERT") {
        await showMessage(payload.new);

        if (payload.new.sender_id !== currentUser.id) {
          await markRead();
        }
      }

      if (payload.eventType === "UPDATE") {
        await showMessage(payload.new);
        await showPinnedMessage();
      }

      if (payload.eventType === "DELETE") {
        const old = $("messages").querySelector(
          '[data-id="' + payload.old.id + '"]'
        );
        if (old) old.remove();
      }
    }
  ).on("broadcast", { event: "typing" }, payload => {
    if (payload.payload?.user_id !== currentUser.id) {
      $("typing").textContent = "Собеседник печатает...";
      clearTimeout(typingTimer);

      typingTimer = setTimeout(() => {
        $("typing").textContent = "";
      }, 1800);
    }
  }).subscribe();
}

async function sendTyping() {
  if (!chatChannel || !currentUser) return;

  await chatChannel.send({
    type: "broadcast",
    event: "typing",
    payload: { user_id: currentUser.id }
  });
}

async function uploadMedia(file, type) {
  if (!currentUser || !chatId || !file) return;

  const maxSize = 25 * 1024 * 1024;
  if (file.size > maxSize) {
    notice("Файл должен быть меньше 25 МБ.");
    return;
  }

  let messageType = type;
  if (type === "file" && file.type.startsWith("image/")) {
    messageType = "image";
  } else if (type === "file" && file.type.startsWith("video/")) {
    messageType = "video";
  } else if (type === "file" && file.type.startsWith("audio/")) {
    messageType = "audio";
  }

  const originalName = file.name || ("voice-" + Date.now());
  const ext = originalName.includes(".")
    ? originalName.split(".").pop().toLowerCase()
    : (messageType === "audio" ? "webm" : "bin");

  const path =
    currentUser.id + "/" + chatId + "/" +
    Date.now() + "-" +
    Math.random().toString(36).slice(2) + "." + ext;

  const { error: uploadError } = await db.storage
    .from(BUCKET)
    .upload(path, file, {
      contentType: file.type || "application/octet-stream",
      upsert: false
    });

  if (uploadError) throw uploadError;

  const { error: insertError } = await db.from("messages").insert({
    chat_id: chatId,
    sender_id: currentUser.id,
    content:
      messageType === "image" ? "Фото" :
      messageType === "video" ? "Видео" :
      messageType === "audio" ? "Голосовое сообщение" :
      "Файл: " + originalName,
    message_type: messageType,
    media_path: path,
    file_name: originalName,
    mime_type: file.type || "application/octet-stream",
    reply_to_id: replyToId || null
  });

  if (insertError) {
    notice("Файл загружен, но сообщение не отправлено: " + insertError.message);
    throw insertError;
  }

  clearReply();
  clearNotice();
}

$("fileInput").addEventListener("change", async event => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    $("photoButton").disabled = true;
    clearNotice();
    await uploadMedia(file, "file");
  } catch (error) {
    notice("Ошибка отправки файла: " + error.message);
  } finally {
    $("photoButton").disabled = false;
    event.target.value = "";
  }
});

async function saveProfile() {
  if (!currentUser) return;

  const { data, error } = await db.from("profiles").upsert({
    id: currentUser.id,
    username:
      $("profileName").value.trim() ||
      (currentUser.email || "user").split("@")[0],
    status_text: $("profileStatus").value.trim(),
    avatar_path: myProfile.avatar_path || null
  }, { onConflict: "id" }).select().single();

  if (error) {
    notice("Ошибка сохранения профиля: " + error.message);
    return;
  }

  myProfile = data;
  profiles[currentUser.id] = data;
  setStatus(data.status_text || "Ваш личный чат ❤️");
  notice("Профиль сохранён ❤️");
}

async function changeAvatar(event) {
  const file = event.target.files[0];
  if (!file || !currentUser || !chatId) return;

  if (!file.type.startsWith("image/")) {
    notice("Выбери изображение.");
    event.target.value = "";
    return;
  }

  if (file.size > 8 * 1024 * 1024) {
    notice("Аватарка должна быть меньше 8 МБ.");
    event.target.value = "";
    return;
  }

  try {
    const ext = file.name.includes(".")
      ? file.name.split(".").pop().toLowerCase()
      : "jpg";

    const path =
      currentUser.id + "/" + chatId + "/avatar-" +
      Date.now() + "." + ext;

    const { error: uploadError } = await db.storage
      .from(BUCKET)
      .upload(path, file, {
        contentType: file.type,
        upsert: false
      });

    if (uploadError) throw uploadError;

    const { data, error } = await db.from("profiles").upsert({
      id: currentUser.id,
      username:
        $("profileName").value.trim() ||
        (currentUser.email || "user").split("@")[0],
      status_text: $("profileStatus").value.trim(),
      avatar_path: path
    }, { onConflict: "id" }).select().single();

    if (error) throw error;

    myProfile = data;
    profiles[currentUser.id] = data;

    const url = await getMediaUrl(path);
    if (url) {
      $("topAvatar").src = url;
      $("topAvatar").hidden = false;
    }

    notice("Аватарка обновлена ❤️");
  } catch (error) {
    notice("Ошибка аватарки: " + error.message);
  } finally {
    event.target.value = "";
  }
}

function stopStream() {
  if (recordingStream) {
    recordingStream.getTracks().forEach(track => track.stop());
    recordingStream = null;
  }
}

async function toggleRecording() {
  if (!currentUser || !chatId) return;

  if (recorder && recorder.state === "recording") {
    recorder.stop();
    $("recordButton").textContent = "🎙";
    $("recordStatus").textContent = "";
    return;
  }

  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    notice("Запись голосовых не поддерживается этим браузером.");
    return;
  }

  try {
    recordingStream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    recordingChunks = [];

    const mimeType =
      MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" :
      MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "";

    recorder = new MediaRecorder(
      recordingStream,
      mimeType ? { mimeType } : {}
    );

    recorder.ondataavailable = event => {
      if (event.data && event.data.size) {
        recordingChunks.push(event.data);
      }
    };

    recorder.onstop = async () => {
      stopStream();

      const type = recordingChunks[0]?.type ||
        recorder?.mimeType || "audio/webm";

      const ext = type.includes("mp4") ? "m4a" : "webm";
      const blob = new Blob(recordingChunks, { type });

      if (blob.size) {
        try {
          const file = new File(
            [blob],
            "voice-" + Date.now() + "." + ext,
            { type }
          );
          await uploadMedia(file, "audio");
        } catch (error) {
          notice("Ошибка отправки голосового: " + error.message);
        }
      }

      recorder = null;
    };

    recorder.start();
    $("recordButton").textContent = "⏹";
    $("recordStatus").textContent = "Запись...";
  } catch (error) {
    stopStream();
    notice("Не удалось начать запись: " + error.message);
  }
}

function showCallOptions() {
  const panel = $("callPanel");
  panel.innerHTML = "";
  panel.style.display = "flex";

  const title = document.createElement("div");
  title.style.width = "100%";
  title.textContent =
    "Звонки: для настоящих аудио- и видеозвонков нужно подключить WebRTC и обмен сигналами.";
  panel.appendChild(title);

  const close = document.createElement("button");
  close.textContent = "Закрыть";
  close.style.background = "#596777";
  close.addEventListener("click", () => {
    panel.style.display = "none";
  });
  panel.appendChild(close);
}

$("loginForm").addEventListener("submit", startLogin);
$("sendButton").addEventListener("click", sendMessage);

$("message").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    event.preventDefault();
    sendMessage();
  }
});

$("message").addEventListener("input", sendTyping);
$("photoButton").addEventListener("click", () => {
  $("fileInput").click();
});
$("recordButton").addEventListener("click", toggleRecording);
$("backButton").addEventListener("click", returnToChatList);

$("profileButton").addEventListener("click", () => {
  const panel = $("profilePanel");
  panel.style.display =
    panel.style.display === "flex" ? "none" : "flex";
});

$("saveProfile").addEventListener("click", saveProfile);
$("chooseAvatar").addEventListener("click", () => {
  $("avatarInput").click();
});
$("avatarInput").addEventListener("change", changeAvatar);
$("callButton").addEventListener("click", showCallOptions);

$("logoutButton").addEventListener("click", async () => {
  const { error } = await db.auth.signOut();

  if (error) {
    notice("Ошибка выхода: " + error.message);
    return;
  }

  currentUser = null;
  chatId = null;
  myProfile = {};
  profiles = {};
  availableChats = [];
  signedUrls.clear();

  if (chatChannel) {
    await db.removeChannel(chatChannel);
    chatChannel = null;
  }

  $("login").style.display = "block";
  $("messages").style.display = "none";
  $("chatList").style.display = "none";
  $("composer").style.display = "none";
  $("profilePanel").style.display = "none";
  $("profileButton").style.display = "none";
  $("backButton").style.display = "none";
  $("callButton").style.display = "none";
  $("messages").innerHTML = "";
  $("chatList").innerHTML = "";
  $("topAvatar").hidden = true;
  $("email").value = "";
  $("password").value = "";
  $("typing").textContent = "";
  $("pinnedBanner").style.display = "none";
  $("callPanel").style.display = "none";
  clearReply();
  clearNotice();
  setStatus("Твой личный чат");
});

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT") {
    currentUser = null;
  }
});

async function restoreSession() {
  setStatus("Проверяем вход...");

  const { data, error } = await db.auth.getSession();

  if (error) {
    notice("Не удалось восстановить вход: " + error.message);
    return;
  }

  if (data.session) {
    await openChat(data.session.user);
  } else {
    $("login").style.display = "block";
    setStatus("Войди в свой аккаунт");
  }
}

restoreSession();
