<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>MiniChat ❤️</title>

<style>
:root {
  --bg: #101820;
  --panel: #182630;
  --panel2: #213541;
  --accent: #50b9a8;
  --text: #f4f7f9;
  --muted: #9aadb8;
  --border: rgba(255,255,255,.08);
  --danger: #ff6876;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

.screen {
  width: 100%;
  max-width: 650px;
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--bg);
}

.topbar {
  height: 64px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 5;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 21px;
  font-weight: 750;
}

.brand-icon {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: var(--accent);
  color: #10211f;
  font-size: 22px;
}

.icon-btn {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 14px;
  background: var(--panel2);
  color: var(--text);
  font-size: 20px;
}

.section-title {
  padding: 20px 16px 10px;
  font-size: 14px;
  color: var(--muted);
  font-weight: 650;
  text-transform: uppercase;
  letter-spacing: .7px;
}

.card {
  margin: 12px;
  padding: 18px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
}

.primary-btn {
  width: 100%;
  min-height: 50px;
  border: 0;
  border-radius: 15px;
  background: var(--accent);
  color: #10211f;
  font-weight: 750;
}

.field {
  width: 100%;
  min-height: 49px;
  padding: 13px 15px;
  margin: 7px 0;
  border: 1px solid var(--border);
  border-radius: 14px;
  outline: none;
  background: var(--panel2);
  color: var(--text);
}

.field:focus {
  border-color: var(--accent);
}

.muted {
  color: var(--muted);
}

#notice {
  position: fixed;
  left: 16px;
  right: 16px;
  bottom: calc(20px + env(safe-area-inset-bottom));
  max-width: 500px;
  margin: auto;
  padding: 14px 17px;
  background: #293c47;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 15px;
  z-index: 100;
  box-shadow: 0 8px 30px #0005;
}

@media (min-width: 700px) {
  body {
    padding: 20px 0;
  }

  .screen {
    min-height: calc(100dvh - 40px);
    border: 1px solid var(--border);
    border-radius: 22px;
    overflow: hidden;
  }
}
</style>
</head>

<body>
<div class="screen" id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">♥</div>
      <span>MiniChat</span>
    </div>
    <button class="icon-btn" id="menuButton" aria-label="Меню">☰</button>
  </header>

  <main id="main">
    <section id="loginScreen" class="card">
      <h2>С возвращением ❤️</h2>
      <p class="muted">Войди, чтобы открыть свои переписки.</p>

      <form id="loginForm">
        <input
          class="field"
          id="email"
          type="email"
          placeholder="Электронная почта"
          autocomplete="email"
          required
        >

        <input
          class="field"
          id="password"
          type="password"
          placeholder="Пароль"
          autocomplete="current-password"
          required
        >

        <button class="primary-btn" type="submit">Войти</button>
      </form>

      <p class="muted" id="loginStatus" role="status"></p>
    </section>

    <section id="chatScreen" class="hidden">
      <div class="section-title">Мои чаты</div>
      <div id="chatList"></div>

      <div id="conversation" class="hidden">
        <div id="chatHeader"></div>
        <div id="messages"></div>
        <div id="composer"></div>
      </div>
    </section>
  </main>
</div>

<div id="notice" class="hidden" role="status"></div>

<script>
const SUPABASE_URL = "https://gjqpucsbfuoqoncmdfbj.supabase.co";
const SUPABASE_KEY = "sb_publishable_S1M6veMpHEUzwpA0HeYwlw_IkQYqIzr";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  }
);

let currentUser = null;
let currentChatId = null;
let currentChatTitle = "";
let myProfile = null;
let myChats = [];

const $ = id => document.getElementById(id);

function showNotice(message) {
  const notice = $("notice");
  if (!notice) {
    alert(message);
    return;
  }

  notice.textContent = message;
  notice.classList.remove("hidden");

  clearTimeout(window.noticeTimeout);
  window.noticeTimeout = setTimeout(() => {
    notice.classList.add("hidden");
  }, 3000);
}

function setLoginStatus(message) {
  const status = $("loginStatus");
  if (status) status.textContent = message;
}

function showLogin() {
  $("loginScreen")?.classList.remove("hidden");
  $("chatScreen")?.classList.add("hidden");
}

function showChats() {
  $("loginScreen")?.classList.add("hidden");
  $("chatScreen")?.classList.remove("hidden");
}

async function loadMyProfile() {
  if (!currentUser) return;

  const { data, error } = await db
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error) {
    console.error("Profile error:", error);
    myProfile = null;
    return;
  }

  myProfile = data;
}

async function loadMyChats() {
  if (!currentUser) return;

  const { data: memberships, error: membershipError } = await db
    .from("chat_members")
    .select("chat_id")
    .eq("user_id", currentUser.id);

  if (membershipError) {
    console.error(membershipError);
    showNotice("Не удалось загрузить чаты. Проверь права Supabase.");
    return;
  }

  const chatIds = [...new Set(
    (memberships || []).map(item => item.chat_id)
  )];

  if (chatIds.length === 0) {
    myChats = [];
    renderChatList();
    showNotice("Для этого аккаунта пока нет доступных чатов.");
    return;
  }

  const { data: chats, error: chatsError } = await db
    .from("chats")
    .select("id, title, is_group, created_at")
    .in("id", chatIds)
    .order("created_at", { ascending: false });

  if (chatsError) {
    console.error(chatsError);
    showNotice("Не удалось загрузить список чатов.");
    return;
  }

  myChats = chats || [];
  renderChatList();
}

function renderChatList() {
  const list = $("chatList");
  if (!list) return;

  list.replaceChildren();

  if (myChats.length === 0) {
    const empty = document.createElement("div");
    empty.className = "card";
    empty.textContent = "Здесь пока нет чатов.";
    list.appendChild(empty);
    return;
  }

  myChats.forEach(chat => {
    const button = document.createElement("button");

    button.type = "button";
    button.style.cssText = `
      display:flex;
      align-items:center;
      gap:13px;
      width:calc(100% - 24px);
      margin:8px 12px;
      padding:14px;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--panel);
      color:var(--text);
      text-align:left;
    `;

    const avatar = document.createElement("div");
    avatar.textContent = chat.is_group ? "👥" : "❤️";
    avatar.style.cssText = `
      width:48px;
      height:48px;
      flex-shrink:0;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:var(--panel2);
      font-size:23px;
    `;

    const details = document.createElement("div");
    details.style.cssText = "min-width:0;flex:1";

    const title = document.createElement("div");
    title.style.cssText = "font-weight:700;font-size:16px";
    title.textContent = chat.title || "Личный чат";

    const subtitle = document.createElement("div");
    subtitle.className = "muted";
    subtitle.style.cssText = "font-size:13px;margin-top:5px";
    subtitle.textContent = "Открыть переписку";

    details.append(title, subtitle);
    button.append(avatar, details);

    button.addEventListener("click", () => {
      if (typeof window.openConversation === "function") {
        window.openConversation(chat.id, chat.title || "Личный чат");
      } else {
        showNotice("Подключим открытие переписки в следующей части.");
      }
    });

    list.appendChild(button);
  });
}

async function openChat() {
  if (!currentUser) {
    showLogin();
    return;
  }

  showChats();

  await loadMyProfile();
  await loadMyChats();
}

$("loginForm")?.addEventListener("submit", async event => {
  event.preventDefault();

  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    setLoginStatus("Введи почту и пароль.");
    return;
  }

  const submitButton = $("loginForm").querySelector(
    'button[type="submit"]'
  );

  if (submitButton) {
    submitButton.disabled = true;
    submitButton.textContent = "Входим...";
  }

  setLoginStatus("");

  try {
    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    currentUser = data.user;
    await openChat();
    setLoginStatus("");
  } catch (error) {
    console.error("Login error:", error);
    setLoginStatus("Ошибка входа: " + error.message);
  } finally {
    if (submitButton) {
      submitButton.disabled = false;
      submitButton.textContent = "Войти";
    }
  }
});

async function restoreSession() {
  try {
    const { data, error } = await db.auth.getSession();

    if (error) throw error;

    currentUser = data.session?.user || null;

    if (currentUser) {
      await openChat();
    } else {
      showLogin();
    }
  } catch (error) {
    console.error("Session error:", error);
    showLogin();
    setLoginStatus("Не удалось восстановить вход. Попробуй войти снова.");
  }
}

db.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT") {
    currentUser = null;
    currentChatId = null;
    showLogin();
  }
});

$("menuButton")?.addEventListener("click", () => {
  showNotice("Меню настроек добавим в следующих частях.");
});

restoreSession();
</script>

<script>
let activeMessagesChannel = null;
let messagesLoading = false;

function styleElement(element, styles) {
  Object.assign(element.style, styles);
}

function formatMessageTime(dateString) {
  if (!dateString) return "";

  const date = new Date(dateString);

  return date.toLocaleTimeString("ru-RU", {
    hour: "2-digit",
    minute: "2-digit"
  });
}

function createChatHeader(title) {
  const header = $("chatHeader");
  header.replaceChildren();

  styleElement(header, {
    display: "flex",
    alignItems: "center",
    gap: "12px",
    padding: "12px",
    background: "var(--panel)",
    borderBottom: "1px solid var(--border)"
  });

  const back = document.createElement("button");
  back.className = "icon-btn";
  back.textContent = "‹";
  back.setAttribute("aria-label", "Назад");
  back.addEventListener("click", returnToChats);

  const avatar = document.createElement("div");
  avatar.textContent = "❤️";
  styleElement(avatar, {
    width: "42px",
    height: "42px",
    borderRadius: "50%",
    background: "var(--panel2)",
    display: "grid",
    placeItems: "center",
    fontSize: "21px"
  });

  const info = document.createElement("div");
  styleElement(info, { flex: "1", minWidth: "0" });

  const name = document.createElement("div");
  name.textContent = title;
  styleElement(name, { fontWeight: "700" });

  const status = document.createElement("div");
  status.textContent = "MiniChat";
  status.className = "muted";
  styleElement(status, { fontSize: "12px", marginTop: "4px" });

  info.append(name, status);
  header.append(back, avatar, info);
}

function createComposer() {
  const composer = $("composer");
  composer.replaceChildren();

  styleElement(composer, {
    display: "flex",
    gap: "8px",
    padding: "12px",
    background: "var(--panel)",
    borderTop: "1px solid var(--border)",
    position: "sticky",
    bottom: "0",
    alignItems: "flex-end"
  });

  const input = document.createElement("textarea");
  input.id = "messageInput";
  input.className = "field";
  input.placeholder = "Сообщение...";
  input.rows = 1;
  input.setAttribute("aria-label", "Текст сообщения");

  styleElement(input, {
    flex: "1",
    minWidth: "0",
    margin: "0",
    resize: "none",
    maxHeight: "120px"
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  input.addEventListener("keydown", event => {
    if (
      event.key === "Enter" &&
      !event.shiftKey &&
      !event.isComposing
    ) {
      event.preventDefault();
      sendTextMessage();
    }
  });

  const send = document.createElement("button");
  send.className = "icon-btn";
  send.textContent = "➤";
  send.setAttribute("aria-label", "Отправить сообщение");
  styleElement(send, {
    background: "var(--accent)",
    color: "#10211f",
    flexShrink: "0"
  });

  send.addEventListener("click", sendTextMessage);

  composer.append(input, send);
}

function renderMessages(messages) {
  const container = $("messages");
  container.replaceChildren();

  styleElement(container, {
    display: "flex",
    flexDirection: "column",
    gap: "10px",
    padding: "14px 12px",
    minHeight: "45vh",
    background: "var(--bg)"
  });

  if (!messages.length) {
    const empty = document.createElement("div");
    empty.textContent = "Начните общаться ❤️";
    empty.className = "muted";

    styleElement(empty, {
      textAlign: "center",
      padding: "30px 10px"
    });

    container.appendChild(empty);
    return;
  }

  messages.forEach(message => {
    const own = message.sender_id === currentUser?.id;

    const row = document.createElement("div");

    styleElement(row, {
      display: "flex",
      justifyContent: own ? "flex-end" : "flex-start",
      width: "100%"
    });

    const bubble = document.createElement("div");

    styleElement(bubble, {
      maxWidth: "85%",
      minWidth: "65px",
      padding: "10px 12px 7px",
      borderRadius: own
        ? "17px 17px 4px 17px"
        : "17px 17px 17px 4px",
      background: own ? "#245c55" : "var(--panel)",
      border: "1px solid var(--border)",
      overflowWrap: "anywhere"
    });

    const content = document.createElement("div");
    content.style.whiteSpace = "pre-wrap";

    if (message.deleted_at) {
      content.textContent = "Сообщение удалено";
      content.className = "muted";
    } else {
      content.textContent = message.content || (
        message.file_name || "Вложение"
      );
    }

    const meta = document.createElement("div");
    meta.textContent =
      formatMessageTime(message.created_at) +
      (message.edited_at ? " · изменено" : "");

    styleElement(meta, {
      fontSize: "10px",
      color: "#bfd2d0",
      textAlign: "right",
      marginTop: "5px"
    });

    bubble.append(content, meta);
    row.appendChild(bubble);
    container.appendChild(row);
  });

  container.scrollTop = container.scrollHeight;
}

async function loadMessages() {
  if (!currentChatId || messagesLoading) return;

  messagesLoading = true;

  try {
    const { data, error } = await db
      .from("messages")
      .select("*")
      .eq("chat_id", currentChatId)
      .is("deleted_at", null)
      .order("created_at", { ascending: true })
      .limit(300);

    if (error) throw error;

    renderMessages(data || []);
  } catch (error) {
    console.error("Load messages error:", error);
    showNotice("Не удалось загрузить сообщения.");
  } finally {
    messagesLoading = false;
  }
}

async function sendTextMessage() {
  const input = $("messageInput");
  if (!input || !currentUser || !currentChatId) return;

  const content = input.value.trim();
  if (!content) return;

  input.disabled = true;

  try {
    const { error } = await db
      .from("messages")
      .insert({
        chat_id: currentChatId,
        sender_id: currentUser.id,
        content: content,
        message_type: "text"
      });

    if (error) throw error;

    input.value = "";
    input.style.height = "auto";

    await loadMessages();
  } catch (error) {
    console.error("Send message error:", error);
    showNotice("Не удалось отправить сообщение.");
  } finally {
    input.disabled = false;
    input.focus();
  }
}

function subscribeToMessages() {
  if (activeMessagesChannel) {
    db.removeChannel(activeMessagesChannel);
    activeMessagesChannel = null;
  }

  activeMessagesChannel = db
    .channel("messages-" + currentChatId)
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "messages",
        filter: "chat_id=eq." + currentChatId
      },
      () => {
        loadMessages();
      }
    )
    .subscribe(status => {
      console.log("Messages realtime:", status);
    });
}

window.openConversation = async function(chatId, title) {
  currentChatId = chatId;
  currentChatTitle = title || "Личный чат";

  $("chatList").classList.add("hidden");
  $("conversation").classList.remove("hidden");

  createChatHeader(currentChatTitle);
  createComposer();

  await loadMessages();
  subscribeToMessages();
};

function returnToChats() {
  if (activeMessagesChannel) {
    db.removeChannel(activeMessagesChannel);
    activeMessagesChannel = null;
  }

  currentChatId = null;

  $("conversation").classList.add("hidden");
  $("chatList").classList.remove("hidden");

  loadMyChats();
}
</script>

<script>
let replyToMessageId = null;

function ensureMediaControls() {
  const composer = $("composer");
  if (!composer || $("mediaButton")) return;

  const mediaButton = document.createElement("button");
  mediaButton.id = "mediaButton";
  mediaButton.className = "icon-btn";
  mediaButton.textContent = "＋";
  mediaButton.title = "Фото, видео или файл";

  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.id = "mediaInput";
  fileInput.accept = "image/*,video/*,audio/*,.pdf,.doc,.docx,.txt,.zip";
  fileInput.hidden = true;

  mediaButton.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files?.[0];
    if (file) await uploadChatFile(file);
    fileInput.value = "";
  });

  composer.prepend(mediaButton);
  composer.appendChild(fileInput);
}

async function uploadChatFile(file) {
  if (!currentUser || !currentChatId) {
    showNotice("Сначала открой переписку.");
    return;
  }

  if (file.size > 25 * 1024 * 1024) {
    showNotice("Максимальный размер файла — 25 МБ.");
    return;
  }

  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
  const path = `${currentChatId}/${currentUser.id}/${Date.now()}_${safeName}`;

  showNotice("Загружаю файл...");

  try {
    const { error: uploadError } = await db.storage
      .from("chat-media")
      .upload(path, file, {
        upsert: false,
        contentType: file.type || "application/octet-stream"
      });

    if (uploadError) throw uploadError;

    let messageType = "file";

    if (file.type.startsWith("image/")) {
      messageType = "image";
    } else if (file.type.startsWith("video/")) {
      messageType = "video";
    } else if (file.type.startsWith("audio/")) {
      messageType = "audio";
    }

    const { error: insertError } = await db
      .from("messages")
      .insert({
        chat_id: currentChatId,
        sender_id: currentUser.id,
        content: "",
        message_type: messageType,
        media_path: path,
        file_name: file.name,
        mime_type: file.type || "application/octet-stream"
      });

    if (insertError) {
      await db.storage.from("chat-media").remove([path]);
      throw insertError;
    }

    showNotice("Файл отправлен ❤️");
    await loadMessages();
  } catch (error) {
    console.error("Upload error:", error);
    showNotice("Не удалось отправить файл. Проверь bucket и права Supabase.");
  }
}

async function getMediaUrl(path) {
  if (!path) return null;

  const { data, error } = await db.storage
    .from("chat-media")
    .createSignedUrl(path, 3600);

  if (error) {
    console.error("Media URL error:", error);
    return null;
  }

  return data?.signedUrl || null;
}

async function renderMediaContent(container, message) {
  if (!message.media_path) return;

  const url = await getMediaUrl(message.media_path);
  if (!url || !container.isConnected) return;

  let element;

  if (message.message_type === "image") {
    element = document.createElement("img");
    element.src = url;
    element.alt = message.file_name || "Изображение";
    element.loading = "lazy";
    element.style.cssText =
      "display:block;max-width:100%;max-height:320px;border-radius:12px";
  } else if (message.message_type === "video") {
    element = document.createElement("video");
    element.src = url;
    element.controls = true;
    element.playsInline = true;
    element.style.cssText =
      "display:block;max-width:100%;max-height:320px;border-radius:12px";
  } else if (message.message_type === "audio") {
    element = document.createElement("audio");
    element.src = url;
    element.controls = true;
    element.style.maxWidth = "100%";
  } else {
    element = document.createElement("a");
    element.href = url;
    element.target = "_blank";
    element.rel = "noopener noreferrer";
    element.textContent = "📎 " + (message.file_name || "Открыть файл");
    element.style.color = "var(--accent)";
  }

  container.prepend(element);
}

async function replyToMessage(messageId) {
  replyToMessageId = messageId;

  let bar = $("replyPreview");

  if (!bar) {
    bar = document.createElement("div");
    bar.id = "replyPreview";
    bar.className = "card";
    bar.style.margin = "8px 12px";
    $("composer").before(bar);
  }

  bar.replaceChildren();

  const label = document.createElement("span");
  label.textContent = "Ответ на сообщение";
  label.style.flex = "1";

  const cancel = document.createElement("button");
  cancel.className = "icon-btn";
  cancel.textContent = "×";
  cancel.addEventListener("click", () => {
    replyToMessageId = null;
    bar.remove();
  });

  bar.append(label, cancel);
  $("messageInput")?.focus();
}

async function editMessage(messageId, oldText) {
  const updatedText = prompt("Измени сообщение:", oldText || "");

  if (updatedText === null || !updatedText.trim()) return;

  try {
    const { error } = await db
      .from("messages")
      .update({
        content: updatedText.trim(),
        edited_at: new Date().toISOString()
      })
      .eq("id", messageId)
      .eq("sender_id", currentUser.id)
      .is("deleted_at", null);

    if (error) throw error;

    await loadMessages();
    showNotice("Сообщение изменено.");
  } catch (error) {
    console.error(error);
    showNotice("Не удалось изменить сообщение.");
  }
}

async function deleteMessage(messageId) {
  if (!confirm("Удалить это сообщение?")) return;

  try {
    const { error } = await db
      .from("messages")
      .update({
        deleted_at: new Date().toISOString()
      })
      .eq("id", messageId)
      .eq("sender_id", currentUser.id);

    if (error) throw error;

    await loadMessages();
    showNotice("Сообщение удалено.");
  } catch (error) {
    console.error(error);
    showNotice("Не удалось удалить сообщение.");
  }
}

/* Добавляем действия к каждому сообщению. */
const originalRenderMessages = renderMessages;

renderMessages = function(messages) {
  originalRenderMessages(messages);

  const container = $("messages");
  if (!container) return;

  const rows = Array.from(container.children);

  messages.forEach((message, index) => {
    const row = rows[index];
    const bubble = row?.firstElementChild;

    if (!bubble) return;

    if (message.media_path && !message.deleted_at) {
      renderMediaContent(bubble, message);
    }

    if (message.deleted_at) return;

    const actions = document.createElement("div");
    actions.style.cssText =
      "display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px";

    const replyButton = document.createElement("button");
    replyButton.textContent = "↩";
    replyButton.title = "Ответить";
    replyButton.style.cssText =
      "border:0;background:transparent;color:#bfd2d0;padding:3px";

    replyButton.addEventListener("click", () => {
      replyToMessage(message.id);
    });

    actions.appendChild(replyButton);

    if (message.sender_id === currentUser?.id) {
      if (message.message_type === "text" && message.content) {
        const editButton = document.createElement("button");
        editButton.textContent = "Изменить";
        editButton.style.cssText =
          "border:0;background:transparent;color:#bfd2d0;padding:3px";
        editButton.addEventListener("click", () => {
          editMessage(message.id, message.content);
        });
        actions.appendChild(editButton);
      }

      const deleteButton = document.createElement("button");
      deleteButton.textContent = "Удалить";
      deleteButton.style.cssText =
        "border:0;background:transparent;color:#ff9ba4;padding:3px";
      deleteButton.addEventListener("click", () => {
        deleteMessage(message.id);
      });
      actions.appendChild(deleteButton);
    }

    bubble.appendChild(actions);
  });
};

/* Добавляем reply_to_id к отправляемым сообщениям. */
const originalSendTextMessage = sendTextMessage;

sendTextMessage = async function() {
  const input = $("messageInput");
  if (!input || !currentUser || !currentChatId) return;

  const content = input.value.trim();
  if (!content) return;

  input.disabled = true;

  try {
    const payload = {
      chat_id: currentChatId,
      sender_id: currentUser.id,
      content,
      message_type: "text",
      reply_to_id: replyToMessageId
    };

    const { error } = await db.from("messages").insert(payload);
    if (error) throw error;

    input.value = "";
    input.style.height = "auto";
    replyToMessageId = null;
    $("replyPreview")?.remove();

    await loadMessages();
  } catch (error) {
    console.error(error);
    showNotice("Не удалось отправить сообщение.");
  } finally {
    input.disabled = false;
    input.focus();
  }
};

/* Добавляем кнопку вложений после создания поля сообщения. */
const originalOpenConversation = window.openConversation;

window.openConversation = async function(chatId, title) {
  await originalOpenConversation(chatId, title);
  ensureMediaControls();
};
</script>

<script>
/* MiniChat 2.0 — финальные элементы интерфейса */

(function () {
  const style = document.createElement("style");

  style.textContent = `
    #chatList button,
    #composer button,
    #chatHeader button {
      transition: opacity .15s ease, transform .15s ease;
    }

    #chatList button:active,
    #composer button:active,
    #chatHeader button:active {
      transform: scale(.97);
    }

    #messages {
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
    }

    #messageInput {
      line-height: 1.45;
    }

    #profilePanel {
      padding: 16px;
      margin: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .profile-avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: var(--panel2);
      display: grid;
      place-items: center;
      font-size: 27px;
      overflow: hidden;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .menu-action {
      display: block;
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--panel2);
      color: var(--text);
      text-align: left;
    }

    .menu-action.danger {
      color: #ff8791;
    }
  `;

  document.head.appendChild(style);

  function addProfileMenu() {
    const main = document.getElementById("main");
    if (!main || document.getElementById("profilePanel")) return;

    const panel = document.createElement("section");
    panel.id = "profilePanel";
    panel.classList.add("hidden");

    const heading = document.createElement("h3");
    heading.textContent = "Мой профиль";

    const userInfo = document.createElement("p");
    userInfo.id = "profileInfo";
    userInfo.className = "muted";
    userInfo.textContent = "Пользователь MiniChat";

    const refreshButton = document.createElement("button");
    refreshButton.className = "menu-action";
    refreshButton.textContent = "↻ Обновить список чатов";

    refreshButton.addEventListener("click", async () => {
      if (typeof loadMyChats === "function") {
        await loadMyChats();
        showNotice("Список чатов обновлён.");
      }
    });

    const backButton = document.createElement("button");
    backButton.className = "menu-action";
    backButton.textContent = "← Назад к чатам";

    backButton.addEventListener("click", () => {
      panel.classList.add("hidden");

      const chatList = document.getElementById("chatList");
      if (chatList && currentUser) {
        chatList.classList.remove("hidden");
      }
    });

    const logoutButton = document.createElement("button");
    logoutButton.className = "menu-action danger";
    logoutButton.textContent = "Выйти из аккаунта";

    logoutButton.addEventListener("click", async () => {
      const confirmed = confirm("Выйти из MiniChat?");
      if (!confirmed) return;

      const { error } = await db.auth.signOut();

      if (error) {
        console.error(error);
        showNotice("Не удалось выйти. Попробуй ещё раз.");
        return;
      }

      currentUser = null;
      currentChatId = null;
      myProfile = null;
      myChats = [];

      panel.classList.add("hidden");
      showLogin();
      showNotice("Ты вышел из аккаунта.");
    });

    panel.append(
      heading,
      userInfo,
      refreshButton,
      backButton,
      logoutButton
    );

    main.appendChild(panel);
  }

  addProfileMenu();

  const menuButton = document.getElementById("menuButton");

  if (menuButton) {
    menuButton.addEventListener("click", () => {
      const panel = document.getElementById("profilePanel");
      const chatList = document.getElementById("chatList");
      const conversation = document.getElementById("conversation");

      if (!panel) return;

      const opening = panel.classList.contains("hidden");

      panel.classList.toggle("hidden", !opening);

      if (opening) {
        chatList?.classList.add("hidden");
        conversation?.classList.add("hidden");

        const info = document.getElementById("profileInfo");

        if (info && currentUser) {
          info.textContent =
            myProfile?.username ||
            currentUser.email ||
            "Пользователь MiniChat";
        }
      } else {
        if (currentChatId) {
          conversation?.classList.remove("hidden");
        } else if (currentUser) {
          chatList?.classList.remove("hidden");
        }
      }
    });
  }

  const originalShowChats = showChats;

  window.addEventListener("online", () => {
    showNotice("Соединение восстановлено.");
  });

  window.addEventListener("offline", () => {
    showNotice("Нет интернета. Проверь соединение.");
  });

  console.log("MiniChat 2.0 interface initialized.");
})();
</script>

</body>
